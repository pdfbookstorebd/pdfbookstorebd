<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পিডিএফ বইয়ের ভান্ডার</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #2c3e50;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .boi-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .boi {
      background-color: white;
      width: 200px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .boi img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .boi a {
      display: block;
      margin-top: 10px;
      padding: 8px;
      background-color: #27ae60;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <header>
    <h1>পিডিএফ বইয়ের ভান্ডার</h1>
    <p>এখান থেকে বিনামূল্যে বই ডাউনলোড করুন</p>
  </header>

  <div class="boi-list">

    <div class="boi">
      <img src="cover1.jpg" alt="প্রথম বই">
      <h3>প্রথম বইয়ের নাম</h3>
      <a href="boi1.pdf" download>ডাউনলোড করুন</a>
    </div>

    <div class="boi">
      <img src="cover2.jpg" alt="দ্বিতীয় বই">
      <h3>দ্বিতীয় বইয়ের নাম</h3>
      <a href="boi2.pdf" download>ডাউনলোড করুন</a>
    </div>

    <div class="boi">
      <img src="cover3.jpg" alt="তৃতীয় বই">
      <h3>তৃতীয় বইয়ের নাম</h3>
      <a href="boi3.pdf" download>ডাউনলোড করুন</a>
    </div>

  </div>

</body>
</html>
